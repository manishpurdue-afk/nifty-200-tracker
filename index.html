<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nifty-200 Basket Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f1f5f9;
  color: #1e293b;
  font-family: 'SF Mono', 'Fira Code', Consolas, monospace;
  font-size: 12.5px;
  padding: 16px 20px;
}

/* ── Header ── */
.header {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 15px 20px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.header h1 { font-size: 16px; font-weight: 700; color: #0f172a; }
.header .sub { color: #64748b; font-size: 10.5px; margin-top: 3px; }
.regime-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 700;
  background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5;
  margin-bottom: 4px;
}
.nifty-line { color: #64748b; font-size: 11px; text-align: right; }
.deploy-label { font-size: 10px; color: #64748b; text-align: right; margin-top: 4px; }
.deploy-track { display: flex; gap: 3px; margin-top: 4px; justify-content: flex-end; }
.deploy-fill  { width: 28px; height: 5px; border-radius: 3px; background: #dc2626; }
.deploy-empty { width: 28px; height: 5px; border-radius: 3px; background: #e2e8f0; }

/* ── KPI row ── */
.kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 10px; }
.kpi-card {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 14px;
}
.kpi-label { color: #94a3b8; font-size: 9px; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 4px; }
.kpi-value { font-size: 18px; font-weight: 700; color: #0f172a; line-height: 1.1; }
.kpi-sub   { color: #94a3b8; font-size: 10px; margin-top: 3px; }
.kpi-card.green .kpi-value { color: #16a34a; }
.kpi-card.red   .kpi-value { color: #dc2626; }
.kpi-card.blue  .kpi-value { color: #2563eb; }

/* ── Ratio row ── */
.ratio-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
.ratio-card {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
  padding: 10px 12px; text-align: center;
}
.ratio-label { color: #94a3b8; font-size: 9px; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 3px; }
.ratio-value { font-size: 15px; font-weight: 600; color: #0f172a; }
.ratio-card.blue  .ratio-value { color: #2563eb; }
.ratio-card.green .ratio-value { color: #16a34a; }
.ratio-card.red   .ratio-value { color: #dc2626; }

/* ── Charts ── */
.charts-row { display: grid; grid-template-columns: 3fr 2fr; gap: 10px; margin-bottom: 10px; }
.chart-panel {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px;
}
.panel-title { color: #94a3b8; font-size: 9.5px; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; }

/* ── Basket + Alloc ── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; }

.basket { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
.basket:last-child { margin-bottom: 0; }
.basket.vacant { opacity: .55; }
.basket-header { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; flex-wrap: wrap; }
.bid { color: #0f172a; font-size: 13px; font-weight: 700; }
.bdate  { color: #64748b; font-size: 10.5px; }
.balloc { color: #b45309; font-size: 10.5px; margin-left: auto; font-weight: 600; }
.vacant-msg { color: #94a3b8; font-size: 11.5px; padding: 4px 0; }

/* ── Tags ── */
.tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; }
.tag-active { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
.tag-vacant { background: #f1f5f9; color: #94a3b8; border: 1px solid #cbd5e1; }
.tag-entry  { background: #dbeafe; color: #2563eb; border: 1px solid #93c5fd; }
.tag-exit   { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }

/* ── Tables ── */
table { width: 100%; border-collapse: collapse; }
th { color: #94a3b8; font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; padding: 5px 8px; text-align: left; border-bottom: 1px solid #f1f5f9; }
td { padding: 6px 8px; border-bottom: 1px solid #f8fafc; color: #334155; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f8fafc; }
.sym  { color: #0f172a; font-weight: 600; }
.sym-list { color: #334155; font-size: 11px; }
.neutral  { color: #94a3b8; }
.positive { color: #16a34a; font-weight: 600; }
.negative { color: #dc2626; font-weight: 600; }
.empty-row { text-align: center; color: #94a3b8; padding: 18px; }
.reason { color: #94a3b8; font-size: 10.5px; }

/* ── Trade panel ── */
.full-panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }

/* ── Backtest strip ── */
.bt-strip {
  background: #0f172a; color: #94a3b8;
  border-radius: 8px; padding: 10px 16px;
  display: flex; gap: 30px; align-items: center;
  font-size: 11px; margin-bottom: 10px;
}
.bt-strip .bt-title { color: #e2e8f0; font-weight: 700; font-size: 11.5px; white-space: nowrap; }
.bt-item { text-align: center; }
.bt-val  { color: #60a5fa; font-size: 13px; font-weight: 700; display: block; }

/* ── Footer ── */
.footer { text-align: center; color: #94a3b8; font-size: 10.5px; padding-top: 10px; border-top: 1px solid #e2e8f0; }
</style>
</head>
